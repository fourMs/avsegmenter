[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avsegmenter"
version = "0.1.0"
description = "Segment concert videos into pieces, applause and talk; describe each piece; export a web timeline."
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "soundfile", "librosa",
  "musicalgestures>=1.32", "ambiscape>=0.49", "musiscape>=0.10",
]

[project.optional-dependencies]
ml = ["panns-inference", "torch", "ultralytics"]
speech = ["faster-whisper"]

[project.scripts]
avsegmenter = "avsegmenter.cli:main"

[tool.setuptools.packages.find]
include = ["avsegmenter*"]

[tool.setuptools.package-data]
avsegmenter = ["web/*"]
